name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate environment and hosting configuration
        run: npm run env:check

      - name: Verify formatting
        run: npm run format:check

      - name: Regenerate deterministic sample data
        run: npm run data:sample

      - name: Verify generated data is committed
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- data)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Type-check framework-neutral packages
        run: npm run typecheck:packages

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Report domain and integration coverage
        run: npm run test:coverage

      - name: Accessibility invariants
        run: npm run test:a11y

      - name: Performance guards
        run: npm run test:performance

      - name: Security and API invariants
        run: npm run test:security

      - name: Source secret and unsafe-sink scan
        run: npm run security:scan

      - name: Full Git history secret scan
        run: npm run security:history

      - name: Verify locked dependency licences
        run: npm run security:licenses

      - name: Reject known high or critical dependency advisories
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Test rendered Worker HTML and headers
        run: npm run test:rendered

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, accessibility, mobile, and visual tests
        run: npm run test:e2e

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}
          path: |
            outputs/playwright-report/
            outputs/playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validated build and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-${{ github.sha }}
          path: |
            dist/
            outputs/
          if-no-files-found: error
          retention-days: 14
